stages:
  preprocess:
    cmd: python src/stages/preprocess.py
    deps:
      - src/stages/preprocess.py
      - data/cluster-trace-v2026-GenAI/pod_gpu_duty_cycle_anon.csv
      - data/cluster-trace-v2026-GenAI/qps.csv
    params:
      - preprocess.raw_gpu_path
      - preprocess.raw_qps_path
      - preprocess.output_dir
      - preprocess.agg_window
    outs:
      - data/processed/features_target.csv

  split:
    cmd: python src/stages/split.py
    deps:
      - src/stages/split.py
      - data/processed/features_target.csv
    params:
      - split.input_path
      - split.output_dir
      - split.test_size
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/stages/train.py
    deps:
      - src/stages/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - base.random_state
      - train.train_path
      - train.test_path
      - train.model_dir
      - train.model_name
      - train.reports_dir
      - train.metrics_name
      - train.features
      - train.target
      - train.n_estimators
      - train.max_depth
    outs:
      - models/baseline_model.pkl
    metrics:
      - reports/metrics.json:
          cache: false